# Gzip compression — HIGH IMPACT for Lighthouse
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/xml+rss
    application/xhtml+xml
    application/atom+xml
    application/rss+xml
    application/ld+json
    application/manifest+json
    application/vnd.ms-fontobject
    application/x-font-ttf
    application/x-web-app-manifest+json
    font/opentype
    font/ttf
    font/eot
    font/otf
    image/svg+xml
    image/x-icon;

# Security headers
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-XSS-Protection "1; mode=block" always;

# Open file cache for static assets
open_file_cache max=1000 inactive=20s;
open_file_cache_valid 30s;
open_file_cache_min_uses 2;
open_file_cache_errors on;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name eos-club.de www.eos-club.de;

    ssl_certificate     /etc/letsencrypt/live/eos-club.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eos-club.de/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Astro hybrid build output
    # Static pages live in dist/client; Keystatic SSR routes are proxied to Node.
    # Repo is at /var/www/public/eosclub; symlink eos-club.de -> eosclub (repo root).
    root /var/www/public/eosclub/dist/client;
    index index.html;

    # Enable ETags globally
    etag on;

    # Keystatic Admin UI — SSR route handled by Astro Node server
    # IMPORTANT: nginx runs in Docker; use container DNS, not 127.0.0.1
    location /keystatic {
        proxy_pass http://eosclub-astro:4322;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Don't cache SSR content
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
    }

    # Keystatic API routes — OAuth callback + API endpoints
    location /api/keystatic {
        proxy_pass http://eosclub-astro:4322;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Don't cache API responses
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
    }

    # Static assets — long cache with ETags
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Astro optimized assets (images, JS, CSS) — hashed filenames, immutable
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Favicon — cache with ETags
    location = /favicon.ico {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        log_not_found off;
        access_log off;
    }

    # Favicon SVG — cache with ETags
    location = /favicon.svg {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        log_not_found off;
        access_log off;
    }

    # HTML pages — short cache with validation (ETags)
    location ~ \.html$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # Static route handling for pre-rendered pages
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Custom 404
    error_page 404 /404.html;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name eos-club.de www.eos-club.de;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/public;
        allow all;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}
